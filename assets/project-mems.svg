<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 580 300"
     width="580"
     height="300">

  <defs>

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="60%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#17102A"/>
    </linearGradient>

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <pattern id="grid"
             width="25"
             height="25"
             patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25"
            fill="none"
            stroke="#00E5FF"
            stroke-opacity="0.045"/>
    </pattern>

  </defs>


  <rect width="580"
        height="300"
        rx="18"
        fill="url(#bg)"/>

  <rect width="580"
        height="300"
        rx="18"
        fill="url(#grid)"/>


  <rect x="1"
        y="1"
        width="578"
        height="298"
        rx="18"
        fill="none"
        stroke="url(#accent)"
        stroke-opacity="0.45"/>


  <text x="35"
        y="42"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#39FF88"
        letter-spacing="1">

    ◈ ANALOG / MIXED-SIGNAL

  </text>


  <text x="35"
        y="78"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#E6EDF3">

    MEMS MICROPHONE

  </text>

  <text x="35"
        y="108"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#E6EDF3">

    ANALOG FRONT-END

  </text>


  <rect x="35"
        y="123"
        width="210"
        height="2"
        rx="1"
        fill="url(#accent)"/>


  <text x="35"
        y="151"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#9AA4B2">

    SKY130 • XSCHEM • NGSPICE

  </text>

  <text x="35"
        y="172"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#9AA4B2">

    CMOS ANALOG FRONT-END DESIGN

  </text>


  <g font-family="Consolas, monospace"
     font-size="10">

    <rect x="35" y="195" width="85" height="23" rx="6"
          fill="#00E5FF" fill-opacity="0.08"
          stroke="#00E5FF" stroke-opacity="0.25"/>

    <text x="50" y="211" fill="#00E5FF">
      SKY130
    </text>


    <rect x="129" y="195" width="80" height="23" rx="6"
          fill="#8B5CF6" fill-opacity="0.08"
          stroke="#8B5CF6" stroke-opacity="0.25"/>

    <text x="144" y="211" fill="#B8A3FF">
      NGSPICE
    </text>


    <rect x="218" y="195" width="73" height="23" rx="6"
          fill="#39FF88" fill-opacity="0.08"
          stroke="#39FF88" stroke-opacity="0.25"/>

    <text x="234" y="211" fill="#39FF88">
      XSCHEM
    </text>

  </g>


  <text x="35"
        y="250"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#39FF88">

    ✓ MICROPHONE MODEL

  </text>

  <text x="185"
        y="250"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#39FF88">

    ✓ CMOS AMPLIFIER

  </text>


  <text x="35"
        y="280"
        font-family="Consolas, monospace"
        font-size="11"
        font-weight="600"
        fill="#00E5FF">

    VIEW REPOSITORY →

  </text>


  <!-- Analog waveform -->

  <g fill="none"
     stroke="#39FF88"
     stroke-width="1.8"
     opacity="0.6">

    <path d="
      M420 150
      C435 120 450 180 465 150
      C480 120 495 180 510 150
      C525 120 540 180 555 150
      C570 120 585 180 600 150
    "/>

  </g>

</svg>
