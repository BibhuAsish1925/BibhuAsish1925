    <circle cx="44" cy="44" r="3.5"/>
    <circle cx="44" cy="72" r="2.5"/>
    <circle cx="44" cy="128" r="2.5"/>
    <circle cx="70" cy="92" r="3"/>
    <circle cx="175" cy="112" r="3"/>

  </g>

  <text x="155"
