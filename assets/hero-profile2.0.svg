    <path d="M1180 72 H1130 V92 H1070 V112 H1025"/>
    <path d="M1180 128 H1138 V108 H1090"/>
    <path d="M1130 92 H1100 V64 H1060"/>
    <path d="M1090 108 H1050 V128 H1010"/>

  </g>

  <g fill="#8B5CF6"
