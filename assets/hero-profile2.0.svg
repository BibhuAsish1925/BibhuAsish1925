  <!--                       HERO WAVEFORM                        -->
  <!-- ========================================================= -->

  <path d="
      M250 175
      H275 V162 H305 V175
      H335 V162 H365 V175
      H395 V162 H425 V175
      H455 V162 H485 V175
      H515 V162 H545 V175
      H575 V162 H605 V175
      H635 V162 H665 V175
      H695 V162 H725 V175
      H755 V162 H785 V175
      H815 V162 H845 V175
      H875 V162 H905 V175
      H935 V162 H965 V175
