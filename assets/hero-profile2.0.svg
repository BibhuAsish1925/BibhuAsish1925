  <!-- ========================================================= -->
<!--                    ABOUT DESCRIPTION                      -->
<!-- ========================================================= -->

<text x="70"
      y="340"
      font-family="Consolas, monospace"
      font-size="11.5"
      fill="#D7E5F5">

  <tspan x="70" dy="0">
    I’m an Electronics and Communication Engineering graduate focused on
    <tspan fill="#00E5FF"> VLSI Design</tspan>,
    <tspan fill="#39FF88"> RTL Design</tspan> and
    <tspan fill="#A78BFA"> Functional Verification</tspan>.
  </tspan>

  <tspan x="70" dy="19">
    I have hands-on experience in Verilog/SystemVerilog RTL,
    <tspan fill="#39FF88"> memory architectures</tspan>,
    SRAM design and simulation-based verification.
  </tspan>

</text>


<!-- ========================================================= -->
<!--                    SECOND PARAGRAPH                       -->
<!-- ========================================================= -->

<text x="70"
      y="402"
      font-family="Consolas, monospace"
      font-size="11.5"
      fill="#D7E5F5">

  <tspan x="70" dy="0">
    My work spans
    <tspan fill="#00E5FF"> digital design</tspan>,
    <tspan fill="#39FF88"> ASIC physical implementation</tspan>
    and full-custom IC layout.
  </tspan>

  <tspan x="70" dy="19">
    I have practical exposure to
    <tspan fill="#A78BFA"> synthesis</tspan>,
    timing, power analysis, DRC/LVS and
    <tspan fill="#00E5FF"> RTL-to-GDSII flows</tspan>.
  </tspan>

</text>


