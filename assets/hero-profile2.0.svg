    <circle cx="1156" cy="44" r="3.5"/>
    <circle cx="1156" cy="72" r="2.5"/>
    <circle cx="1156" cy="128" r="2.5"/>
    <circle cx="1130" cy="92" r="3"/>
    <circle cx="1025" cy="112" r="3"/>

  </g>

  <text x="1040"
        y="82"
        font-family="Consolas, monospace"
        font-size="12"
        font-weight="700"
        fill="#39FF88"
        letter-spacing="2">
    VLSI
  </text>


