<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 670"
     width="1200"
     height="670">

  <defs>

    <!-- ========================================================= -->
    <!--                         BACKGROUND                         -->
    <!-- ========================================================= -->

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050914"/>
      <stop offset="42%"  stop-color="#081426"/>
      <stop offset="72%"  stop-color="#0D1228"/>
      <stop offset="100%" stop-color="#17102A"/>
    </linearGradient>

    <linearGradient id="panel"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#071323"/>
      <stop offset="55%"  stop-color="#09182B"/>
      <stop offset="100%" stop-color="#11142D"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!--                     MULTI-COLOR ACCENTS                   -->
    <!-- ========================================================= -->

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="25%"  stop-color="#38BDF8"/>
      <stop offset="48%"  stop-color="#8B5CF6"/>
      <stop offset="70%"  stop-color="#F472B6"/>
      <stop offset="86%"  stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <linearGradient id="nameGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="30%"  stop-color="#00E5FF"/>
      <stop offset="50%"  stop-color="#C084FC"/>
      <stop offset="72%"  stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <linearGradient id="cyanViolet"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!--                            GRID                            -->
    <!-- ========================================================= -->

    <pattern id="grid"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">

      <path d="M28 0H0V28"
            fill="none"
            stroke="#38BDF8"
            stroke-opacity="0.055"
            stroke-width="0.8"/>

    </pattern>


    <!-- ========================================================= -->
    <!--                             GLOW                           -->
    <!-- ========================================================= -->

    <filter id="glow"
            x="-80%"
            y="-80%"
            width="260%"
            height="260%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="6"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ========================================================= -->
  <!--                       MAIN BACKGROUND                       -->
  <!-- ========================================================= -->

  <rect x="0"
        y="0"
        width="1200"
        height="670"
        fill="#050914"/>

  <rect x="8"
        y="8"
        width="1184"
        height="654"
        rx="24"
        fill="url(#bg)"/>

  <rect x="8"
        y="8"
        width="1184"
        height="654"
        rx="24"
        fill="url(#grid)"/>


  <!-- ========================================================= -->
  <!--                       OUTER BORDER                         -->
  <!-- ========================================================= -->

  <rect x="8"
        y="8"
        width="1184"
        height="654"
        rx="24"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity="0.85"/>


  <!-- ========================================================= -->
  <!--                        TOP HERO                            -->
  <!-- ========================================================= -->

  <rect x="20"
        y="20"
        width="1160"
        height="180"
        rx="20"
        fill="#061020"
        fill-opacity="0.78"
        stroke="url(#accent)"
        stroke-width="1.8"
        stroke-opacity="0.85"/>


  <!-- ========================================================= -->
  <!--                     LEFT HERO CIRCUITS                     -->
  <!-- ========================================================= -->

  <g fill="none"
     stroke="#00E5FF"
     stroke-width="1.5"
     opacity="0.8">

    <path d="M20 72 H70 V92 H128 V112 H175"/>
    <path d="M20 128 H62 V108 H110"/>
    <path d="M70 92 H96 V64 H140"/>
    <path d="M110 108 H150 V128 H188"/>

  </g>

  <g fill="#00E5FF"
