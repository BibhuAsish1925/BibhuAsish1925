<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 560"
     width="760"
     height="560">

  <defs>

    <!-- ================================================= -->
    <!--                    BACKGROUND                     -->
    <!-- ================================================= -->

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#17102A"/>

    </linearGradient>


    <!-- ================================================= -->
    <!--                    ACCENT                         -->
    <!-- ================================================= -->

    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#39FF88"/>

    </linearGradient>


    <!-- ================================================= -->
    <!--                      GRID                         -->
    <!-- ================================================= -->

    <pattern id="grid"
             width="24"
             height="24"
             patternUnits="userSpaceOnUse">

      <path d="M24 0H0V24"
            fill="none"
            stroke="#00E5FF"
            stroke-opacity="0.045"
            stroke-width="0.7"/>

    </pattern>


    <!-- ================================================= -->
    <!--                       GLOW                        -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <filter id="strongGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur stdDeviation="5"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!--                    MAIN PANEL                     -->
  <!-- ================================================= -->

  <rect x="8"
        y="8"
        width="744"
        height="544"
        rx="22"
        fill="url(#bg)"/>

  <rect x="8"
        y="8"
        width="744"
        height="544"
        rx="22"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!--                     BORDER                        -->
  <!-- ================================================= -->

  <rect x="8"
        y="8"
        width="744"
        height="544"
        rx="22"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity="0.8"/>


  <!-- ================================================= -->
  <!--                 DECORATIVE TRACES                 -->
  <!-- ================================================= -->

  <g fill="none"
     stroke-width="1.5"
     opacity="0.45">

    <path d="M8 85 H55 V110 H95"/>
    <path d="M8 430 H45 V405 H90"/>

    <path d="M752 100 H705 V125 H665"/>
    <path d="M752 455 H710 V430 H670"/>

  </g>


  <g filter="url(#glow)">

    <circle cx="55"
            cy="85"
            r="3"
            fill="#00E5FF"/>

    <circle cx="45"
            cy="430"
            r="3"
            fill="#00E5FF"/>

    <circle cx="705"
            cy="100"
            r="3"
            fill="#8B5CF6"/>

    <circle cx="710"
            cy="455"
            r="3"
            fill="#39FF88"/>

  </g>


  <!-- ================================================= -->
  <!--                    HEADER                         -->
  <!-- ================================================= -->

  <!-- small chip -->

  <g transform="translate(245 42)"
     fill="none"
     stroke="#00E5FF">

    <rect width="38"
          height="38"
          rx="6"
          stroke-width="1.7"/>

    <rect x="10"
          y="10"
          width="18"
          height="18"
          rx="3"/>

    <path d="M0 10H-8 M0 19H-8 M0 28H-8"/>
    <path d="M38 10H46 M38 19H46 M38 28H46"/>

    <path d="M10 0V-8 M19 0V-8 M28 0V-8"/>
    <path d="M10 38V46 M19 38V46 M28 38V46"/>

  </g>


  <text x="305"
        y="72"
        font-family="Consolas, monospace"
        font-size="25"
        font-weight="700"
        letter-spacing="2"
        fill="#E6EDF3">

    ABOUT ME

  </text>


  <line x1="400"
        y1="62"
        x2="685"
        y2="62"
        stroke="url(#accent)"
        stroke-width="2"
        opacity="0.65"/>


  <!-- ================================================= -->
  <!--              PROFESSIONAL IDENTITY               -->
  <!-- ================================================= -->

  <text x="55"
        y="130"
        font-family="Consolas, monospace"
        font-size="23"
        font-weight="700"
        fill="#00E5FF">

    ⚡ ELECTRONICS &amp; VLSI ENGINEER

  </text>


  <text x="55"
        y="158"
        font-family="Consolas, monospace"
        font-size="13"
        fill="#9AA4B2">

    Digital Hardware • RTL • ASIC • Verification

  </text>


  <!-- ================================================= -->
  <!--                    ABOUT TEXT                     -->
  <!-- ================================================= -->

  <g font-family="Consolas, monospace"
     font-size="12.5"
     fill="#B8C4D6">

    <text x="55" y="195">
      Electronics &amp; Communication Engineering graduate
    </text>

    <text x="55" y="216">
      focused on Digital VLSI, RTL Design, ASIC Design
    </text>

    <text x="55" y="237">
      and Design Verification.
    </text>

    <text x="55" y="270">
      Hands-on experience with Verilog-based digital
    </text>

    <text x="55" y="291">
      systems, FSMs, memory architectures, arithmetic
    </text>

    <text x="55" y="312">
      circuits and simulation-driven verification.
    </text>

  </g>


  <!-- ================================================= -->
  <!--                HIGHLIGHTED FLOW                   -->
  <!-- ================================================= -->

  <text x="55"
        y="350"
        font-family="Consolas, monospace"
        font-size="13"
        font-weight="700"
        fill="#8B5CF6">

    ▸ ENGINEERING FOCUS

  </text>


  <!-- ================================================= -->
  <!--                  FOCUS CARDS                      -->
  <!-- ================================================= -->

  <g font-family="Consolas, monospace"
     font-size="12"
     font-weight="600">

    <!-- RTL -->

    <rect x="55"
          y="370"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#00E5FF"
          stroke-width="1.2"/>

    <text x="72"
          y="394"
          fill="#00E5FF">

      ▸ RTL DESIGN

    </text>


    <!-- Verification -->

    <rect x="270"
          y="370"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#8B5CF6"
          stroke-width="1.2"/>

    <text x="287"
          y="394"
          fill="#8B5CF6">

      ▸ VERIFICATION

    </text>


    <!-- Memory -->

    <rect x="485"
          y="370"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#39FF88"
          stroke-width="1.2"/>

    <text x="502"
          y="394"
          fill="#39FF88">

      ▸ MEMORY DESIGN

    </text>


    <!-- ASIC -->

    <rect x="55"
          y="418"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#8B5CF6"
          stroke-width="1.2"/>

    <text x="72"
          y="442"
          fill="#8B5CF6">

      ▸ ASIC DESIGN

    </text>


    <!-- SystemVerilog -->

    <rect x="270"
          y="418"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#00E5FF"
          stroke-width="1.2"/>

    <text x="287"
          y="442"
          fill="#00E5FF">

      ▸ SYSTEMVERILOG

    </text>


    <!-- Analog -->

    <rect x="485"
          y="418"
          width="200"
          height="38"
          rx="9"
          fill="#080B12"
          stroke="#39FF88"
          stroke-width="1.2"/>

    <text x="502"
          y="442"
          fill="#39FF88">

      ▸ ANALOG IC DESIGN

    </text>

  </g>


  <!-- ================================================= -->
  <!--                   CURRENT FLOW                    -->
  <!-- ================================================= -->

  <rect x="55"
        y="480"
        width="630"
        height="48"
        rx="12"
        fill="#080B12"
        stroke="url(#accent)"
        stroke-width="1.3"
        opacity="0.95"/>


  <text x="75"
        y="500"
        font-family="Consolas, monospace"
        font-size="10"
        fill="#596273">

    CURRENT FOCUS

  </text>


  <text x="75"
        y="518"
        font-family="Consolas, monospace"
        font-size="11"
        font-weight="700"
        fill="#E6EDF3">

    RTL → VERIFY → SYNTHESIS → PHYSICAL IMPLEMENTATION

  </text>


  <!-- ================================================= -->
  <!--                 ANIMATED PULSE                    -->
  <!-- ================================================= -->

  <circle cx="55"
          cy="500"
          r="3.5"
          fill="#00E5FF"
          filter="url(#strongGlow)">

    <animate
      attributeName="cx"
      values="55;685"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!--                 CORNER PULSES                     -->
  <!-- ================================================= -->

  <circle cx="25"
          cy="25"
          r="3"
          fill="#00E5FF"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.6s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="735"
          cy="527"
          r="3"
          fill="#39FF88"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.8s"
      repeatCount="indefinite"/>

  </circle>


</svg>
