<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 560"
     width="420"
     height="560">

  <defs>

    <!-- Card background -->
    <linearGradient id="cardBg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F18"/>
      <stop offset="60%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#17102A"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="20"
             height="20"
             patternUnits="userSpaceOnUse">

      <path d="M20 0H0V20"
            fill="none"
            stroke="#00E5FF"
            stroke-opacity="0.05"
            stroke-width="0.7"/>

    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- CARD -->
  <!-- ================================================= -->

  <rect x="10"
        y="10"
        width="400"
        height="540"
        rx="22"
        fill="url(#cardBg)"/>

  <rect x="10"
        y="10"
        width="400"
        height="540"
        rx="22"
        fill="url(#grid)"/>


  <!-- Border -->

  <rect x="10"
        y="10"
        width="400"
        height="540"
        rx="22"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"/>


  <!-- ================================================= -->
  <!-- TOP CHIP / ID -->
  <!-- ================================================= -->

  <rect x="35"
        y="35"
        width="350"
        height="65"
        rx="12"
        fill="#080B12"
        stroke="#00E5FF"
        stroke-opacity="0.3"/>


  <!-- Small IC -->

  <g transform="translate(55 49)"
     stroke="#00E5FF"
     fill="none">

    <rect width="38"
          height="38"
          rx="5"
          stroke-width="1.5"/>

    <rect x="10"
          y="10"
          width="18"
          height="18"
          rx="2"/>

    <path d="M0 10H-7 M0 19H-7 M0 28H-7"/>
    <path d="M38 10H45 M38 19H45 M38 28H45"/>

  </g>


  <text x="115"
        y="62"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#7D8795"
        letter-spacing="1">

    DIGITAL VLSI

  </text>

  <text x="115"
        y="83"
        font-family="Consolas, monospace"
        font-size="18"
        font-weight="700"
        fill="#00E5FF"
        letter-spacing="1">

    ENGINEERING ID

  </text>


  <!-- ================================================= -->
  <!-- AVATAR PLACEHOLDER -->
  <!-- ================================================= -->

  <circle cx="210"
          cy="190"
          r="70"
          fill="#080B12"
          stroke="url(#accent)"
          stroke-width="2"/>


  <!-- Stylized IC/person symbol -->

  <g transform="translate(170 150)"
     fill="none"
     stroke="#8B5CF6">

    <rect x="15"
          y="18"
          width="50"
          height="50"
          rx="8"
          stroke-width="2"/>

    <rect x="27"
          y="30"
          width="26"
          height="26"
          rx="4"
          stroke-width="1.5"/>

    <path d="M15 30H5 M15 43H5 M15 56H5"/>
    <path d="M65 30H75 M65 43H75 M65 56H75"/>

    <path d="M30 18V8 M45 18V8 M60 18V8"/>
    <path d="M30 68V78 M45 68V78 M60 68V78"/>

  </g>


  <!-- ================================================= -->
  <!-- NAME -->
  <!-- ================================================= -->

  <text x="210"
        y="295"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="25"
        font-weight="700"
        letter-spacing="2"
        fill="#E6EDF3">

    BIBHU ASISH PANDA

  </text>


  <rect x="85"
        y="310"
        width="250"
        height="2"
        rx="1"
        fill="url(#accent)"/>


  <!-- ================================================= -->
  <!-- PROFESSIONAL IDENTITY -->
  <!-- ================================================= -->

  <text x="210"
        y="345"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="14"
        font-weight="600"
        fill="#00E5FF">

    RTL • ASIC • MEMORY

  </text>

  <text x="210"
        y="370"
        text-anchor="middle"
        font-family="Consolas, monospace"
        font-size="14"
        font-weight="600"
        fill="#39FF88">

    VERIFICATION • VLSI

  </text>


  <!-- ================================================= -->
  <!-- DETAILS -->
  <!-- ================================================= -->

  <g font-family="Consolas, monospace"
     font-size="11">

    <text x="55"
          y="415"
          fill="#596273">
      SPECIALIZATION
    </text>

    <text x="55"
          y="435"
          fill="#E6EDF3">
      DIGITAL VLSI &amp; ASIC DESIGN
    </text>


    <text x="55"
          y="465"
          fill="#596273">
      CORE
    </text>

    <text x="55"
          y="485"
          fill="#E6EDF3">
      VERILOG • SYSTEMVERILOG • MEMORY
    </text>


    <text x="55"
          y="515"
          fill="#596273">
      FLOW
    </text>

    <text x="55"
          y="535"
          fill="#E6EDF3">
      RTL → VERIFY → SYNTHESIS → SILICON
    </text>

  </g>

</svg>
