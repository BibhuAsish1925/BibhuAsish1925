<svg width="1000" height="350" viewBox="0 0 1000 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!--                    BACKGROUND                     -->
    <!-- ================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="35%" stop-color="#081426"/>
      <stop offset="70%" stop-color="#0D1228"/>
      <stop offset="100%" stop-color="#17102A"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="22%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="72%" stop-color="#F472B6"/>
      <stop offset="88%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <linearGradient id="movingSignal"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="72%" stop-color="#F472B6"/>
      <stop offset="88%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="violetPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="yellowGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>

    <!-- ================================================= -->
    <!--                     GLOW                         -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-50%" y="-50%"
            width="200%" height="200%">

      <feGaussianBlur stdDeviation="4"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="strongGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">

      <feGaussianBlur stdDeviation="7"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- ================================================= -->
    <!--                    PCB GRID                      -->
    <!-- ================================================= -->

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#243149"
            stroke-width="1"/>

    </pattern>

    <!-- ================================================= -->
    <!--                  SOFT COLOR GLOW                 -->
    <!-- ================================================= -->

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- ================================================= -->
  <!--                    BACKGROUND                     -->
  <!-- ================================================= -->

  <rect width="1000"
        height="350"
        rx="20"
        fill="url(#bg)"/>

  <rect width="1000"
        height="350"
        rx="20"
        fill="url(#grid)"
        opacity="0.42"/>

  <!-- subtle colorful atmosphere -->

  <circle cx="110"
          cy="100"
          r="150"
          fill="url(#cyanGlow)"/>

  <circle cx="500"
          cy="170"
          r="180"
          fill="url(#violetGlow)"/>

  <circle cx="890"
          cy="105"
          r="150"
          fill="url(#pinkGlow)"/>

  <rect x="1.5"
        y="1.5"
        width="997"
        height="347"
        rx="19"
        fill="none"
        stroke="url(#border)"
        stroke-width="3"
        opacity="0.95"/>


  <!-- ================================================= -->
  <!--              DECORATIVE PCB TRACES               -->
  <!-- ================================================= -->

  <g fill="none"
     stroke-linecap="round">

    <!-- left cyan -->

    <path d="M0 65 H70 L100 95 H150"
          stroke="#00E5FF"
          stroke-width="2"
          opacity="0.8"/>

    <circle cx="150"
            cy="95"
            r="5"
            fill="#00E5FF"
            filter="url(#glow)"/>


    <!-- left violet -->

    <path d="M0 100 H55 L85 130 H135"
          stroke="#8B5CF6"
          stroke-width="2"
          opacity="0.65"/>

    <circle cx="135"
            cy="130"
            r="4"
            fill="#8B5CF6"
            filter="url(#glow)"/>


    <!-- left pink -->

    <path d="M0 290 H70 L100 260 H155"
          stroke="#F472B6"
          stroke-width="2"
          opacity="0.65"/>

    <circle cx="155"
            cy="260"
            r="4"
            fill="#F472B6"
            filter="url(#glow)"/>


    <!-- right green -->

    <path d="M1000 65 H930 L900 95 H850"
          stroke="#39FF88"
          stroke-width="2"
          opacity="0.8"/>

    <circle cx="850"
            cy="95"
            r="5"
            fill="#39FF88"
            filter="url(#glow)"/>


    <!-- right yellow -->

    <path d="M1000 290 H930 L900 260 H845"
          stroke="#FACC15"
          stroke-width="2"
          opacity="0.65"/>

    <circle cx="845"
            cy="260"
            r="4"
            fill="#FACC15"
            filter="url(#glow)"/>

  </g>


  <!-- ================================================= -->
  <!--                    HEADER                         -->
  <!-- ================================================= -->

  <text x="500"
        y="45"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        letter-spacing="4"
        fill="#00E5FF">

    ◈ HARDWARE COMMUNICATION LINK

  </text>


  <text x="500"
        y="78"
        text-anchor="middle"
        font-family="monospace"
        font-size="30"
        font-weight="bold"
        letter-spacing="2"
        fill="#E6EDF3">

    LET'S CONNECT

  </text>


  <text x="500"
        y="102"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#AAB8CC">

    OPEN TO VLSI • ASIC • RTL DESIGN • VERIFICATION • COLLABORATION

  </text>


  <!-- ================================================= -->
  <!--              MAIN ANIMATED SIGNAL                -->
  <!-- ================================================= -->

  <path d="M80 130
           H150
           L170 112
           H235
           L255 130
           H320
           L340 112
           H405
           L425 130
           H490
           L510 112
           H575
           L595 130
           H660
           L680 112
           H745
           L765 130
           H920"

        fill="none"
        stroke="#172334"
        stroke-width="3"/>


  <path d="M80 130
           H150
           L170 112
           H235
           L255 130
           H320
           L340 112
           H405
           L425 130
           H490
           L510 112
           H575
           L595 130
           H660
           L680 112
           H745
           L765 130
           H920"

        fill="none"
        stroke="url(#movingSignal)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="100 900"
        filter="url(#glow)">

    <animate
      attributeName="stroke-dashoffset"
      from="1000"
      to="0"
      dur="3.2s"
      repeatCount="indefinite"/>

  </path>


  <!-- ================================================= -->
  <!--                 SIGNAL NODES                     -->
  <!-- ================================================= -->

  <g filter="url(#glow)">

    <circle cx="170" cy="130" r="5" fill="#00E5FF">
      <animate attributeName="r"
               values="4;8;4"
               dur="1.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="340" cy="130" r="5" fill="#8B5CF6">
      <animate attributeName="r"
               values="4;8;4"
               dur="1.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="510" cy="130" r="5" fill="#F472B6">
      <animate attributeName="r"
               values="4;8;4"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="680" cy="130" r="5" fill="#FACC15">
      <animate attributeName="r"
               values="4;8;4"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="765" cy="130" r="5" fill="#39FF88">
      <animate attributeName="r"
               values="4;9;4"
               dur="1.6s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!--                CONNECTION CARDS                  -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="12"
     font-weight="bold"
     text-anchor="middle">


    <!-- ================================================= -->
    <!--                     LINKEDIN                    -->
    <!-- ================================================= -->

    <a href="https://www.linkedin.com/in/bibhu-asish-panda-05332b288"
       target="_blank">

      <g>

        <rect x="145"
              y="175"
              width="190"
              height="55"
              rx="10"
              fill="#0A1220"
              stroke="url(#cyanSky)"
              stroke-width="2.5"/>

        <rect x="147"
              y="177"
              width="186"
              height="51"
              rx="8"
              fill="none"
              stroke="#00E5FF"
              stroke-width="1"
              opacity="0.25"/>

        <circle cx="175"
                cy="202"
                r="13"
                fill="none"
                stroke="#00E5FF"
                stroke-width="2">

          <animate
            attributeName="r"
            values="11;15;11"
            dur="2s"
            repeatCount="indefinite"/>

        </circle>

        <circle cx="175"
                cy="202"
                r="4"
                fill="#00E5FF"
                filter="url(#glow)"/>

        <text x="245"
              y="207"
              fill="#E6EDF3">

          LINKEDIN

        </text>

      </g>

    </a>


    <!-- ================================================= -->
    <!--                       EMAIL                     -->
    <!-- ================================================= -->

    <a href="mailto:bibhuap2003@gmail.com">

      <g>

        <rect x="405"
              y="175"
              width="190"
              height="55"
              rx="10"
              fill="#0A1220"
              stroke="url(#violetPink)"
              stroke-width="2.5"/>

        <rect x="407"
              y="177"
              width="186"
              height="51"
              rx="8"
              fill="none"
              stroke="#F472B6"
              stroke-width="1"
              opacity="0.22"/>

        <circle cx="435"
                cy="202"
                r="13"
                fill="none"
                stroke="#8B5CF6"
                stroke-width="2">

          <animate
            attributeName="r"
            values="11;15;11"
            dur="2.2s"
            repeatCount="indefinite"/>

        </circle>

        <circle cx="435"
                cy="202"
                r="4"
                fill="#F472B6"
                filter="url(#glow)"/>

        <text x="505"
              y="207"
              fill="#E6EDF3">

          EMAIL

        </text>

      </g>

    </a>


    <!-- ================================================= -->
    <!--                     GITHUB                      -->
    <!-- ================================================= -->

    <a href="https://github.com/BibhuAsish1925"
       target="_blank">

      <g>

        <rect x="665"
              y="175"
              width="190"
              height="55"
              rx="10"
              fill="#0A1220"
              stroke="url(#yellowGreen)"
              stroke-width="2.5"/>

        <rect x="667"
              y="177"
              width="186"
              height="51"
              rx="8"
              fill="none"
              stroke="#39FF88"
              stroke-width="1"
              opacity="0.22"/>

        <circle cx="695"
                cy="202"
                r="13"
                fill="none"
                stroke="#39FF88"
                stroke-width="2">

          <animate
            attributeName="r"
            values="11;15;11"
            dur="1.8s"
            repeatCount="indefinite"/>

        </circle>

        <circle cx="695"
                cy="202"
                r="4"
                fill="#39FF88"
                filter="url(#strongGlow)"/>

        <text x="765"
              y="207"
              fill="#E6EDF3">

          GITHUB

        </text>

      </g>

    </a>

  </g>


  <!-- ================================================= -->
  <!--             CONNECTION TRACES                    -->
  <!-- ================================================= -->

  <g fill="none"
     stroke-width="2"
     stroke-linecap="round">

    <path d="M175 150 V175"
          stroke="#00E5FF"
          stroke-dasharray="6 6">

      <animate
        attributeName="stroke-dashoffset"
        from="12"
        to="0"
        dur="0.8s"
        repeatCount="indefinite"/>

    </path>


    <path d="M500 150 V175"
          stroke="#F472B6"
          stroke-dasharray="6 6">

      <animate
        attributeName="stroke-dashoffset"
        from="12"
        to="0"
        dur="0.9s"
        repeatCount="indefinite"/>

    </path>


    <path d="M825 150 V175"
          stroke="#39FF88"
          stroke-dasharray="6 6">

      <animate
        attributeName="stroke-dashoffset"
        from="12"
        to="0"
        dur="0.75s"
        repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ================================================= -->
  <!--                    TAGLINE                       -->
  <!-- ================================================= -->

  <text x="500"
        y="275"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        font-style="italic"
        fill="#E6EDF3">

    "Designing reliable hardware, one RTL block at a time."

    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================================= -->
  <!--                 COLOR ACCENT LINE                -->
  <!-- ================================================= -->

  <line x1="250"
        y1="300"
        x2="750"
        y2="300"
        stroke="url(#border)"
        stroke-width="2"
        opacity="0.75"/>


  <!-- ================================================= -->
  <!--              ANIMATED CORNER SIGNAL              -->
  <!-- ================================================= -->

  <circle cx="25"
          cy="25"
          r="5"
          fill="#00E5FF"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="975"
          cy="325"
          r="5"
          fill="#39FF88"
          filter="url(#strongGlow)">

    <animate
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


</svg>
