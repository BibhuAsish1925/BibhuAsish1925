    </text>

  </g>


  <text x="35"
        y="220"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#39FF88">

    ✓ READ / WRITE

  </text>

  <text x="155"
        y="220"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#39FF88">

    ✓ SNM / POWER

  </text>

  <text x="285"
        y="220"
        font-family="Consolas, monospace"
        font-size="11"
        fill="#39FF88">

    ✓ LAYOUT

  </text>


  <text x="35"
        y="265"
        font-family="Consolas, monospace"
        font-size="11"
        font-weight="600"
        fill="#00E5FF">

    VIEW REPOSITORY →

  </text>


  <!-- SRAM cell decoration -->

  <g fill="none"
     stroke="#8B5CF6"
     stroke-width="1"
     opacity="0.5">

    <rect x="450" y="95"
          width="75"
          height="75"
          rx="7"/>

    <path d="M450 120 H425 M450 145 H425"/>
    <path d="M525 120 H550 M525 145 H550"/>

    <path d="M470 95 V75 M505 95 V75"/>
    <path d="M470 170 V190 M505 170 V190"/>

  </g>

</svg>
